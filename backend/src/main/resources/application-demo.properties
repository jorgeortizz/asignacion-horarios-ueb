# DEMO temporal exclusivamente para desarrollo / pruebas locales: NO es la BD de entrega.
spring.datasource.url=jdbc:h2:mem:horariosdemo;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false
# La vista demo se crea sobre las tablas H2, sin ejecutar migraciones MySQL.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/demo/vistas.sql
spring.flyway.clean-disabled=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
