# Conexion MySQL local
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/horarios_ueb?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=America/Bogota
spring.datasource.username=${DB_USER:horarios_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Persistencia JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Migraciones Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=${FLYWAY_DB_USER}
spring.flyway.password=${FLYWAY_DB_PASSWORD}
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false