# Activar UNICAMENTE cuando Claude entregue el esquema validado e instalado.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/horarios_ueb?useUnicode=true&characterEncoding=utf8&connectionTimeZone=LOCAL}
spring.datasource.username=${DB_USER:horarios_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
