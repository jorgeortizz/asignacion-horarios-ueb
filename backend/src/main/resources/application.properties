spring.application.name=asignacion-horarios
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:demo}
spring.thymeleaf.cache=false
spring.jpa.open-in-view=false
# Solo perfiles: demo = H2 temporal, mysql = schema real de Claude.

# Etapa 3: sesión HttpOnly, SameSite; para producción HTTPS añadir cookie.secure=true.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Bootstrap administrativo explícito, normalmente desactivado.
ueb.bootstrap.enabled=${UEB_BOOTSTRAP_ENABLED:false}
ueb.bootstrap.identificador=${UEB_BOOTSTRAP_IDENTIFICADOR:}
ueb.bootstrap.password=${UEB_BOOTSTRAP_PASSWORD:}

